name: TrialKeyboard
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  OpenKeyboardKit:
    path: .
  Pow:
    url: https://github.com/EmergeTools/Pow
    version: 1.0.5
  SwiftUIIntrospect:
    url: https://github.com/siteline/swiftui-introspect
    version: 27.1.0
targets:
  TrialKeyboard:
    type: application
    platform: iOS
    sources:
      - path: TrialApp/Host
    info:
      path: TrialApp/Host/Info.plist
      properties:
        CFBundleDisplayName: "Keyboard Lab"
        CFBundleName: TrialKeyboard
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "6"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.goldypov.keyboardtrial"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: TrialKeyboardExtension
        embed: true
  TrialKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TrialApp/Keyboard
    info:
      path: TrialApp/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: "Keyboard Lab"
        CFBundleName: TrialKeyboardExtension
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.keyboard-service"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: true
            PrimaryLanguage: "en-US"
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.goldypov.keyboardtrial.extension"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: OpenKeyboardKit
      - package: Pow
      - package: SwiftUIIntrospect
