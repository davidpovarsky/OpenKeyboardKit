name: Build Trial Keyboard IPA

on:
  push:
    branches:
      - trial/ipad-keyboard
      - feature/native-js-script-lab
      - fix/keyboard-bottom-docking
      - feature/keyboard-lab-suite
      - feature/keyboard-native-input-redesign
      - hotfix/keyboard-restore-v071
    paths:
      - 'TrialApp/**'
      - 'TrialKeyboard.yml'
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/trial-keyboard-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check keyboard input regression guards
        run: python3 TrialApp/Tests/verify_keyboard_tool_inputs.py
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec TrialKeyboard.yml
      - name: Build iOS app and keyboard extension (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project TrialKeyboard.xcodeproj \
            -scheme TrialKeyboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee trial-build.log
      - name: Verify app contains keyboard extension and assemble IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=".build/DerivedData/Build/Products/Release-iphoneos/TrialKeyboard.app"
          test -d "$APP"
          test -d "$APP/PlugIns/TrialKeyboardExtension.appex"
          mkdir -p Payload
          ditto "$APP" "Payload/TrialKeyboard.app"
          zip -qry TrialKeyboard-unsigned.ipa Payload
          unzip -l TrialKeyboard-unsigned.ipa | grep 'TrialKeyboardExtension.appex'
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path(".build/DerivedData/Build/Products/Release-iphoneos/TrialKeyboard.app")
          extension = app / "PlugIns" / "TrialKeyboardExtension.appex"
          host = plistlib.loads((app / "Info.plist").read_bytes())
          keyboard = plistlib.loads((extension / "Info.plist").read_bytes())
          attrs = keyboard["NSExtension"]["NSExtensionAttributes"]
          assert keyboard["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.keyboard-service"
          assert keyboard["NSExtension"]["NSExtensionPrincipalClass"] == "TrialKeyboardExtension.KeyboardViewController"
          assert keyboard["CFBundleIdentifier"] == host["CFBundleIdentifier"] + ".extension"
          assert keyboard["CFBundleShortVersionString"] == "0.7.1"
          assert attrs["RequestsOpenAccess"] is True
          assert attrs["IsASCIICapable"] is True
          assert attrs["PrimaryLanguage"] == "en-US"
          print("Verified system keyboard .appex, bundle IDs, language and Full Access request")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TrialKeyboard-unsigned-IPA
          path: TrialKeyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trial-build-log
          path: trial-build.log
          if-no-files-found: ignore
      - name: Publish Keyboard Lab unsigned IPA (optional)
        if: github.ref == 'refs/heads/hotfix/keyboard-restore-v071'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-lab-v0.7.1
          name: "Keyboard Lab v0.7.1 - Restore Stable Keyboard"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: TrialKeyboard-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            Emergency stability hotfix built from the known-working v0.6.1 UI.
            - Reverts experimental UIKit UIToolbar embedded in OpenKeyboardKit keyboard toolbar.
            - Restores the proven SwiftUI key row and system-wide input extension.
            - Fixes input target routing: when no internal field is focused, keys write to the host app.
            - External selection-change callbacks attempt to return focus to host; To App fallback.
            - Hebrew tool layout can type into the host as well.
            - Preserves existing native SwiftUI tool launcher, scripts, context previews, and persistent keys.
            - Xcode 27 build; unsigned IPA. Sign app and embedded keyboard .appex with SideStore/AltStore.
            - Compiles and passes static checks; actual rendering on iPad still requires device verification.
