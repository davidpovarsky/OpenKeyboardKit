name: Build Trial Keyboard IPA

on:
  push:
    branches:
      - trial/ipad-keyboard
      - feature/native-js-script-lab
      - fix/keyboard-bottom-docking
      - feature/keyboard-lab-suite
      - feature/keyboard-native-input-redesign
    paths:
      - 'TrialApp/**'
      - 'TrialKeyboard.yml'
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/trial-keyboard-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check keyboard input regression guards
        run: python3 TrialApp/Tests/verify_keyboard_tool_inputs.py
      - name: Verify Xcode toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec TrialKeyboard.yml
      - name: Build iOS app and keyboard extension (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project TrialKeyboard.xcodeproj \
            -scheme TrialKeyboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee trial-build.log
      - name: Verify app contains keyboard extension and assemble IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=".build/DerivedData/Build/Products/Release-iphoneos/TrialKeyboard.app"
          test -d "$APP"
          test -d "$APP/PlugIns/TrialKeyboardExtension.appex"
          mkdir -p Payload
          ditto "$APP" "Payload/TrialKeyboard.app"
          zip -qry TrialKeyboard-unsigned.ipa Payload
          unzip -l TrialKeyboard-unsigned.ipa | grep 'TrialKeyboardExtension.appex'
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path(".build/DerivedData/Build/Products/Release-iphoneos/TrialKeyboard.app")
          extension = app / "PlugIns" / "TrialKeyboardExtension.appex"
          host = plistlib.loads((app / "Info.plist").read_bytes())
          keyboard = plistlib.loads((extension / "Info.plist").read_bytes())
          attrs = keyboard["NSExtension"]["NSExtensionAttributes"]
          assert keyboard["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.keyboard-service"
          assert keyboard["NSExtension"]["NSExtensionPrincipalClass"] == "TrialKeyboardExtension.KeyboardViewController"
          assert keyboard["CFBundleIdentifier"] == host["CFBundleIdentifier"] + ".extension"
          assert keyboard["CFBundleShortVersionString"] == "0.6.1"
          assert attrs["RequestsOpenAccess"] is True
          assert attrs["IsASCIICapable"] is True
          assert attrs["PrimaryLanguage"] == "en-US"
          print("Verified system keyboard .appex, bundle IDs, language and Full Access request")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TrialKeyboard-unsigned-IPA
          path: TrialKeyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trial-build-log
          path: trial-build.log
          if-no-files-found: ignore
      - name: Publish Keyboard Lab unsigned IPA (optional)
        if: github.ref == 'refs/heads/feature/keyboard-native-input-redesign'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-lab-v0.6.1
          name: "Keyboard Lab v0.6.1 - System Previews & Interactions"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: TrialKeyboard-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            Keyboard Lab v0.6.0: native SwiftUI tools and persistent keyboard.
            - The keyboard stays visible under every tool and Script Studio.
            - Text fields are routed to the active tool, not to the host document.
            - Backspace, space, return, caret movement and English/Hebrew tool input.
            - Native Liquid Glass (iPadOS 26+), SF Symbols, Pow animations, SwiftUI Introspect.
            - System context menu previews for tools, scripts, search results, notes, snippets and clipboard.
            - Native long-press actions, selection feedback and iPad pointer hover lift.
            - Sefaria, Wikipedia, dictionary, text actions, calculator, notes, snippets, media, GIFs, clipboard and JavaScriptCore plugins.
            - CI checks every input panel and verifies the embedded keyboard extension.
            - Unsigned IPA. When installing through SideStore/AltStore, keep and sign the embedded .appex.
            This is an experimental build. On-device UI and SideStore signing behavior still require acceptance testing.
