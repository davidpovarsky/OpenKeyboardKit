name: Build Trial Keyboard IPA

on:
  push:
    branches:
      - trial/ipad-keyboard
      - feature/native-js-script-lab
      - fix/keyboard-bottom-docking
      - feature/keyboard-lab-suite
      - feature/keyboard-native-input-redesign
      - hotfix/keyboard-restore-v071
      - feature/native-glass-controls-v08
      - feature/smart-command-bar-v09
      - feature/adaptive-toolbar-v010
      - feature/keyboard-layout-v011
    paths:
      - 'TrialApp/**'
      - 'TrialKeyboard.yml'
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/trial-keyboard-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keyboard-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check keyboard input regression guards
        run: python3 TrialApp/Tests/verify_keyboard_tool_inputs.py
      - name: Validate command manifests with real Swift Foundation
        run: |
          swiftc TrialApp/Keyboard/LabCommandManifest.swift \
            TrialApp/Keyboard/ScriptLibrary.swift \
            TrialApp/Tests/command_manifest_contract.swift \
            -o /tmp/keyboard-command-manifest-tests
          /tmp/keyboard-command-manifest-tests
      - name: Select Xcode 26.3 (iOS 26 SDK, compatible with iPadOS 27)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec TrialKeyboard.yml
      - name: Build iOS app and keyboard extension (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project TrialKeyboard.xcodeproj \
            -scheme TrialKeyboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee trial-build.log
      - name: Verify app contains keyboard extension and assemble IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=".build/DerivedData/Build/Products/Release-iphoneos/TrialKeyboard.app"
          test -d "$APP"
          test -d "$APP/PlugIns/TrialKeyboardExtension.appex"
          mkdir -p Payload
          ditto "$APP" "Payload/TrialKeyboard.app"
          zip -qry TrialKeyboard-unsigned.ipa Payload
          unzip -l TrialKeyboard-unsigned.ipa | grep 'TrialKeyboardExtension.appex'
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path(".build/DerivedData/Build/Products/Release-iphoneos/TrialKeyboard.app")
          extension = app / "PlugIns" / "TrialKeyboardExtension.appex"
          host = plistlib.loads((app / "Info.plist").read_bytes())
          keyboard = plistlib.loads((extension / "Info.plist").read_bytes())
          attrs = keyboard["NSExtension"]["NSExtensionAttributes"]
          assert keyboard["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.keyboard-service"
          assert keyboard["NSExtension"]["NSExtensionPrincipalClass"] == "TrialKeyboardExtension.KeyboardViewController"
          assert keyboard["CFBundleIdentifier"] == host["CFBundleIdentifier"] + ".extension"
          assert keyboard["CFBundleShortVersionString"] == "0.11.0"
          assert attrs["RequestsOpenAccess"] is True
          assert attrs["IsASCIICapable"] is True
          assert attrs["PrimaryLanguage"] == "en-US"
          print("Verified system keyboard .appex, bundle IDs, language and Full Access request")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TrialKeyboard-unsigned-IPA
          path: TrialKeyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trial-build-log
          path: trial-build.log
          if-no-files-found: ignore
      - name: Publish Keyboard Lab unsigned IPA (optional)
        if: github.ref == 'refs/heads/feature/keyboard-layout-v011'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-lab-v0.11.0
          name: "Keyboard Lab v0.11.0 - Compact Keys and Smart Toolbar"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: TrialKeyboard-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            Keyboard Lab v0.11.0 — revised after iPad screenshot/interactive
            approval. Separate pre-release; no stable builds were modified.

            - Permanent visible Tools and Grow/Shrink buttons in the
              KeyboardKit toolbar, beside manifest picker, native search,
              Run and More.
            - Transient offline word suggestions ABOVE the toolbar,
              never replacing or hiding the command input field.
            - Local completion refresh after EVERY host key action, not
              solely on UIKit textDidChange notifications.
            - Intrinsic content-height measurement of the KeyboardKit rows,
              toolbar and result/suggestion panels; removes fixed 420-point
              empty landscape band from normal typing mode.
            - KeyboardKit key rows themselves grow in Large Keys mode.
            - Tool library as a real workspace instead of overcrowding
              the keyboard. Tool search restores keys when focused.
            - Native settings controls for word completions, key size,
              language and network permission opt-in.
            - Shared English/Hebrew key renderer and backward-compatible
              Script Studio, JavaScript manifests and insertion behavior.
            - Release build uses Xcode 26.3 and verifies the embedded
              .appex before publishing an UNSIGNED IPA.
            - Final iPadOS 27 landscape/portrait and focus testing still
              requires a real device.
