name: Build Trial Keyboard IPA

on:
  push:
    branches:
      - trial/ipad-keyboard
      - feature/native-js-script-lab
      - fix/keyboard-bottom-docking
      - feature/keyboard-lab-suite
    paths:
      - 'TrialApp/**'
      - 'TrialKeyboard.yml'
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/trial-keyboard-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec TrialKeyboard.yml
      - name: Build iOS app and keyboard extension (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project TrialKeyboard.xcodeproj \
            -scheme TrialKeyboard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee trial-build.log
      - name: Verify app contains keyboard extension and assemble IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=".build/DerivedData/Build/Products/Release-iphoneos/TrialKeyboard.app"
          test -d "$APP"
          test -d "$APP/PlugIns/TrialKeyboardExtension.appex"
          mkdir -p Payload
          ditto "$APP" "Payload/TrialKeyboard.app"
          zip -qry TrialKeyboard-unsigned.ipa Payload
          unzip -l TrialKeyboard-unsigned.ipa | grep 'TrialKeyboardExtension.appex'
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path(".build/DerivedData/Build/Products/Release-iphoneos/TrialKeyboard.app")
          extension = app / "PlugIns" / "TrialKeyboardExtension.appex"
          host = plistlib.loads((app / "Info.plist").read_bytes())
          keyboard = plistlib.loads((extension / "Info.plist").read_bytes())
          attrs = keyboard["NSExtension"]["NSExtensionAttributes"]
          assert keyboard["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.keyboard-service"
          assert keyboard["NSExtension"]["NSExtensionPrincipalClass"] == "TrialKeyboardExtension.KeyboardViewController"
          assert keyboard["CFBundleIdentifier"] == host["CFBundleIdentifier"] + ".extension"
          assert keyboard["CFBundleShortVersionString"] == "0.3.0"
          assert attrs["RequestsOpenAccess"] is True
          assert attrs["IsASCIICapable"] is True
          assert attrs["PrimaryLanguage"] == "en-US"
          print("Verified system keyboard .appex, bundle IDs, language and Full Access request")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TrialKeyboard-unsigned-IPA
          path: TrialKeyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trial-build-log
          path: trial-build.log
          if-no-files-found: ignore
      - name: Publish Keyboard Lab v0.2.1 unsigned IPA
        if: github.ref == 'refs/heads/feature/keyboard-lab-suite'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keyboard-lab-v0.3.0
          name: "Keyboard Lab v0.3.0 - Native Tool Suite"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: TrialKeyboard-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            iPad keyboard experiment based on OpenKeyboardKit (MIT).
            - Pin original-size keyboard keys to the bottom; extra vertical space remains above.
            - Persist expanded/compact state and stabilize height calculation across window changes.
            - Improve system keyboard setup instructions and embedded-extension diagnostics.
            - Retains SwiftUI Script Studio, JavaScriptCore and Full Access request.
            This IPA is UNSIGNED: use SideStore/AltStore to re-sign both the host app and its embedded keyboard extension.
            Keyboard availability must be tested in Notes and other supported apps; iPadOS may block third-party keyboards.
